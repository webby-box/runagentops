<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Desk · Money</title>
  <meta name="theme-color" content="#0a0c10">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="top-left">
        <span class="mark">desk</span>
        <span class="sep">/</span>
        <span class="sub">money</span>
      </div>
      <div class="top-right">
        <span id="badge" class="badge badge--flat" aria-live="polite">—</span>
        <span id="clock" class="clock">—</span>
      </div>
    </header>

    <div id="err" class="banner" hidden role="alert"></div>

    <section class="metrics" aria-label="Balances">
      <article class="tile">
        <h2>Liquid</h2>
        <p class="num" id="liquid">—</p>
        <p class="hint">USD free</p>
      </article>
      <article class="tile">
        <h2>Open uPnL</h2>
        <p class="num" id="upnl">—</p>
        <p class="hint">unrealized</p>
      </article>
      <article class="tile tile--accent">
        <h2>Equity</h2>
        <p class="num" id="equity">—</p>
        <p class="hint">liquid + uPnL</p>
      </article>
    </section>

    <section class="panel" aria-label="Position">
      <div class="panel-head">
        <h2>Position</h2>
        <p class="meta" id="venue">—</p>
      </div>
      <div id="pos-empty" class="empty" hidden>No open ticket · FLAT</div>
      <div id="pos-body" class="pos-grid">
        <div><span class="k">Side</span><span class="v" id="side">—</span></div>
        <div><span class="k">Lev</span><span class="v" id="lev">—</span></div>
        <div><span class="k">Coll</span><span class="v" id="coll">—</span></div>
        <div><span class="k">Size</span><span class="v" id="size">—</span></div>
        <div><span class="k">Entry</span><span class="v" id="entry">—</span></div>
        <div><span class="k">Mark</span><span class="v" id="mark-px">—</span></div>
      </div>
    </section>

    <section class="panel" aria-label="Levels">
      <div class="panel-head">
        <h2>SL / TP</h2>
        <p class="meta" id="chain-flags">—</p>
      </div>
      <div id="therm-wrap">
        <div class="therm" aria-hidden="true">
          <div class="therm-fill" id="therm-fill"></div>
          <span class="tick tick--sl" id="tick-sl">SL</span>
          <span class="tick tick--m" id="tick-m">M</span>
          <span class="tick tick--tp" id="tick-tp">TP</span>
        </div>
        <div class="dist-row">
          <span id="dist-sl">—</span>
          <span id="dist-tp">—</span>
        </div>
      </div>
      <div id="therm-empty" class="empty" hidden>No levels</div>
    </section>

    <section class="panel panel--split" aria-label="Residuals and wallet">
      <div>
        <h2>Residuals</h2>
        <p class="num num--sm" id="residuals">—</p>
        <p class="hint" id="residuals-note">—</p>
      </div>
      <div>
        <h2>Wallet</h2>
        <p class="mono" id="wallet">—</p>
        <p class="hint" id="notes">—</p>
      </div>
    </section>

    <footer class="foot">
      <span id="src">—</span>
      <span>refresh 60s · no keys</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
